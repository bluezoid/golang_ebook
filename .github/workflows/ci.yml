name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '24'

jobs:
  # ── Lint + TypeScript ────────────────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

  # ── Unit + Integration Tests ─────────────────────────────────────────────────
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Run Vitest with coverage
        run: npm run test:unit:coverage
        env:
          MONGODB_URI: mongodb://localhost:27017/test
          CASHFREE_APP_ID: TEST_APP_ID
          CASHFREE_SECRET_KEY: TEST_SECRET
          CASHFREE_ENV: sandbox
          NEXT_PUBLIC_CASHFREE_ENV: sandbox
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          R2_ACCOUNT_ID: test-account
          R2_ACCESS_KEY_ID: test-key
          R2_SECRET_ACCESS_KEY: test-secret
          R2_BUCKET_NAME: test-bucket
          R2_ENDPOINT: https://test.r2.cloudflarestorage.com
          R2_FULL_PDF_KEY: ebooks/golang/v1/deep_dive_into_go.pdf
          R2_SAMPLE_PDF_KEY: ebooks/golang/v1/deep_dive_into_go_sample.pdf
          BREVO_API_KEY: test-brevo-key
          BREVO_SENDER_EMAIL: support@bluezoid.in
          BREVO_SENDER_NAME: Bluezoid

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ── E2E Tests ────────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build Next.js app
        run: npm run build
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          CASHFREE_APP_ID: ${{ secrets.CASHFREE_APP_ID }}
          CASHFREE_SECRET_KEY: ${{ secrets.CASHFREE_SECRET_KEY }}
          CASHFREE_ENV: sandbox
          NEXT_PUBLIC_CASHFREE_ENV: sandbox
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_FULL_PDF_KEY: ${{ secrets.R2_FULL_PDF_KEY }}
          R2_SAMPLE_PDF_KEY: ${{ secrets.R2_SAMPLE_PDF_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: Bluezoid

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          CASHFREE_APP_ID: ${{ secrets.CASHFREE_APP_ID }}
          CASHFREE_SECRET_KEY: ${{ secrets.CASHFREE_SECRET_KEY }}
          CASHFREE_ENV: sandbox
          NEXT_PUBLIC_CASHFREE_ENV: sandbox
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_FULL_PDF_KEY: ${{ secrets.R2_FULL_PDF_KEY }}
          R2_SAMPLE_PDF_KEY: ${{ secrets.R2_SAMPLE_PDF_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: Bluezoid

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── Accessibility Tests ───────────────────────────────────────────────────────
  a11y-tests:
    name: Accessibility Tests (axe-core)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build Next.js app
        run: npm run build
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          CASHFREE_APP_ID: ${{ secrets.CASHFREE_APP_ID }}
          CASHFREE_SECRET_KEY: ${{ secrets.CASHFREE_SECRET_KEY }}
          CASHFREE_ENV: sandbox
          NEXT_PUBLIC_CASHFREE_ENV: sandbox
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_FULL_PDF_KEY: ${{ secrets.R2_FULL_PDF_KEY }}
          R2_SAMPLE_PDF_KEY: ${{ secrets.R2_SAMPLE_PDF_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: Bluezoid

      - name: Run accessibility tests
        run: npm run test:a11y
        env:
          CI: true

      - name: Upload accessibility report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-report
          path: playwright-report/
          retention-days: 7
